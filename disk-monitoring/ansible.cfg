[defaults]
inventory            = inventory
roles_path           = roles
collections_path     = ./collections:~/.ansible/collections
# SSM sessions are slower than SSH - parallelism keeps large fleets fast.
forks                = 50
timeout              = 60
interpreter_python   = auto_silent
host_key_checking    = False
retry_files_enabled  = False
callback_result_format = yaml
# Cache facts so reporting / alarm plays don't have to reconnect to every VM.
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 86400

[inventory]
enable_plugins = amazon.aws.aws_ec2, yaml, host_list
# Cache EC2 API responses briefly; thousands of instances x 48 accounts adds up.
cache            = True
cache_plugin     = jsonfile
cache_connection = .cache/inventory
cache_timeout    = 300
