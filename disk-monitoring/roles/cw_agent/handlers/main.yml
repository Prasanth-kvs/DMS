---
- name: Reload CloudWatch agent (Linux)
  ansible.builtin.command:
    argv: ["{{ cw_linux_ctl }}", -a, fetch-config, -m, ec2, -s, -c, "file:{{ cw_linux_config }}"]
  changed_when: true

- name: Reload CloudWatch agent (Windows)
  ansible.windows.win_shell: "& '{{ cw_windows_ctl }}' -a fetch-config -m ec2 -s -c 'file:{{ cw_windows_config }}'"
  changed_when: true
