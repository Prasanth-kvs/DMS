---
- name: "No instance profile - attach the monitoring profile | {{ iid }}"
  when: h.iam_instance_profile is not defined
  ansible.builtin.command:
    argv: [aws, ec2, associate-iam-instance-profile,
           --instance-id, "{{ iid }}",
           --iam-instance-profile, "Name={{ instance_profile_name }}",
           --profile, "{{ aws_profile }}", --region, "{{ h.aws_region }}"]
  register: profile_attach
  changed_when: profile_attach.rc == 0
  # Already associated (stale inventory cache, or attached by someone else) is fine.
  failed_when: profile_attach.rc != 0 and 'existing association' not in profile_attach.stderr

- name: "Has its own role - add the agent policies to it | {{ iid }}"
  when:
    - h.iam_instance_profile is defined
    - extend_existing_instance_roles | bool
    - (h.iam_instance_profile.arn | split('/') | last) != instance_profile_name
  block:
    - name: "Resolve the role behind the instance profile | {{ iid }}"
      ansible.builtin.command:
        argv: [aws, iam, get-instance-profile,
               --instance-profile-name, "{{ h.iam_instance_profile.arn | split('/') | last }}",
               --query, "InstanceProfile.Roles[0].RoleName", --output, text,
               --profile, "{{ aws_profile }}"]
      register: role_lookup
      changed_when: false

    - name: "Read policies already attached to the role | {{ iid }}"
      ansible.builtin.command:
        argv: [aws, iam, list-attached-role-policies, --role-name, "{{ role_lookup.stdout }}",
               --query, "AttachedPolicies[].PolicyArn", --output, json,
               --profile, "{{ aws_profile }}"]
      register: attached
      changed_when: false

    - name: "Attach only the missing agent policies | {{ iid }}"
      ansible.builtin.command:
        argv: [aws, iam, attach-role-policy, --role-name, "{{ role_lookup.stdout }}",
               --policy-arn, "{{ item }}", --profile, "{{ aws_profile }}"]
      loop: "{{ required_instance_policies | difference(attached.stdout | from_json) }}"
      register: policy_attach
      changed_when: true

- name: "Remember that access changed (triggers the SSM registration wait) | {{ iid }}"
  when: (profile_attach is changed) or (policy_attach is defined and policy_attach is changed)
  ansible.builtin.set_fact:
    access_changed: true
